{% extends 'base.html' %}

{% block conteudo %}
<h2>Editar Vendedor</h2>

<form method="POST" action="/atualizar_vendedor/{{ vendedor.id }}">
    <!-- Perfil -->
    <label>Nome</label>
    <input name="nome" value="{{ vendedor.nome }}" required>
    <label>CPF</label>
    <input name="cpf" value="{{ vendedor.cpf }}" required>
    <label>Email</label>
    <input type="email" name="email" value="{{ vendedor.email }}" placeholder="Email">
    <label>Data de nascimento</label>
    <input type="date" name="data_nascimento" value="{{ vendedor.data_nascimento.strftime('%Y-%m-%d') if vendedor.data_nascimento }}">

    <!-- Login -->
    <h3>Login do Sistema</h3>
    <label>Login</label>
<input name="nome_login" value="{{ vendedor.nome }}">

    <!-- Senha -->
    <div class="password-container">
        <label>Senha</label>
        <input name="senha" value="{{ vendedor.senha }}" placeholder="Nova senha (deixe em branco para não alterar)">
        <span class="toggle-password" onclick="togglePassword('login_senha', this)">👁️</span>
    </div>

    <button type="submit">Salvar</button>
    <button type="button" class="botao" onclick="history.back()">Voltar</button>
</form>

<script>
function togglePassword(id, element) {
    const input = document.getElementById(id);
    if (input.type === 'password') {
        input.type = 'text';
        element.textContent = '🙈';
    } else {
        input.type = 'password';
        element.textContent = '👁️';
    }
}
</script>
{% endblock %}
