{% extends 'base.html' %}

{% block conteudo %}
<h2>Cadastrar Vendedor</h2>

<div class="form-container">
    <form action="/add_vendedor" method="POST">
        <!-- Dados do vendedor -->
        <input type="text" name="nome" placeholder="Nome" required>
        <input type="text" name="cpf" placeholder="CPF" maxlength="11" pattern="\d{11}" required>
        <input type="email" name="email" placeholder="Email">
        <input type="date" name="data_nascimento">

        <!-- Login do sistema -->
        <!--  IMPORTANTE: no routes você usa 'login_nome' e 'login_senha', então o HTML precisa bater -->
        <input type="text" name="login_nome" placeholder="Nome de usuário (login)" required>
        <div class="password-container">
            <input type="password" id="senha-login" name="login_senha" placeholder="Senha de login" required>
            <span class="toggle-password" onclick="togglePassword('senha-login', this)">👁️</span>
        </div>

        <button type="submit">Cadastrar</button>
        <div style="display: inline-block; margin-left: 10px;">
            <button type="button" class="botao" onclick="history.back()">Voltar</button>
        </div>
    </form>
</div>

<script>
function togglePassword(id, element) {
    const input = document.getElementById(id);
    if (input.type === 'password') {
        input.type = 'text';
        element.textContent = '🙈';
    } else {
        input.type = 'password';
        element.textContent = '👁️';
    }
}
</script>

{% endblock %}
