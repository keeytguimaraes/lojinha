{% extends 'base.html' %}

{% block conteudo %}

<h2>Editar Administrador</h2>

<form method="POST" action="/adms/editar/{{ adm.id }}">
    <input name="nome" value="{{ adm.nome }}" required>
    <input name="cpf" value="{{ adm.cpf }}" required>
    <input type="email" name="email" value="{{ adm.email }}">
    <input type="date" name="data_nascimento"
           value="{{ adm.data_nascimento.strftime('%Y-%m-%d') if adm.data_nascimento }}">

    <button type="submit">Salvar</button>

    <div style="display: inline-block; margin-left: 10px;">
        <button type="button" class="botao" onclick="history.back()">Voltar</button>
    </div>
</form>

{% endblock %}
