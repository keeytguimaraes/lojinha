{% extends 'base.html' %}

{% block conteudo %}

<h2>Cadastrar Administrador</h2>

<div class="form-container">
    <form action="/add_adms" method="POST">

        <!-- Dados do ADM -->
        <label>Nome</label>
        <input type="text" name="nome" placeholder="Nome completo" required>

        <label>CPF</label>
        <input type="text" name="cpf" placeholder="CPF" maxlength="11" pattern="\d{11}" required>

        <label>Email</label>
        <input type="email" name="email" placeholder="Email">

        <label>Data de nascimento</label>
        <input type="date" name="data_nascimento">

        <hr>

        <!-- Login do sistema -->
        <h3>Dados de Acesso</h3>

        <label>Usuário</label>
        <input type="text" name="login_nome" placeholder="Nome de usuário" required>

        <label>Senha</label>
        <div class="password-container">
            <input type="password" id="senha-login" name="senha" placeholder="Senha de login" required>
            <span class="toggle-password" onclick="togglePassword('senha-login', this)">👁️</span>
        </div>

        <br><br>

        <button type="submit">Cadastrar</button>

        <div style="display: inline-block; margin-left: 10px;">
            <button type="button" class="botao" onclick="history.back()">Voltar</button>
        </div>

    </form>
</div>
<script>
    function togglePassword(id, element) {
        const input = document.getElementById(id);
    
        if (input.type === 'password') {
            input.type = 'text';
            element.textContent = '🙈';
        } else {
            input.type = 'password';
            element.textContent = '👁️';
        }
    }
    </script>

{% endblock %}
